name: Générer le catalogue PokéTracker

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/catalogue.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Générer le catalogue (incrémental)
        run: node scripts/build-catalog.mjs
      - name: Enregistrer le catalogue
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/index.json catalog/search.json catalog/sets
          git diff --cached --quiet || git commit -m "Mise à jour du catalogue Pokémon"
          git pull --rebase -q || true
          git push
