name: Générer le catalogue PokéTracker

on:
  workflow_dispatch:
  push:
    paths:
      - 'catalog-sets.json'
      - 'scripts/**'
      - '.github/workflows/catalogue.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Générer les cartes
        run: node scripts/build-catalog.mjs

      - name: Enregistrer le catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-data.js catalog/
          git diff --cached --quiet || git commit -m "Génération du catalogue Pokémon"
          git push
